# Local development stack (Windows + WSL2/Docker).
#
# It differs from docker-compose.yml in two ways:
#  - the indexer is built from the local sources instead of using the published image;
#  - the containers use a public DNS resolver, because some ISPs/routers block
#    the domains used by the indexers (e.g. redestorrents.com, vaqueirofilmes1.com).
#
# Usage (from WSL):
#   cd /mnt/c/Users/eriva/Documents/projetos/torrent-indexer
#   docker compose -f docker-compose.local.yml up -d --build
#
# The server will be available at http://localhost:8080/

services:
  torrent-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torrent-indexer
    restart: unless-stopped
    ports:
      - "8080:7006"
    networks:
      - indexer
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=0 # 0=debug, 1=info, 2=warn, 3=error
      - REDIS_HOST=redis
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191
      - REQUEST_TIMEOUT_MILLISECONDS=30000

  redis:
    image: redis:alpine
    container_name: torrent-indexer-redis
    restart: unless-stopped
    networks:
      - indexer

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: torrent-indexer-flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    networks:
      - indexer
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - BROWSER_TIMEOUT=60000

networks:
  indexer:
